name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    # Windows, to match the release workflow's build environment. The
    # generator/lint suites also hit a Windows-only file-lock race unless
    # serialized (see the `-j 1` note below).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Monorepo: the Flutter app lives under packages/foxy (Dart pub
      # workspace root at the repo root).
      - name: Resolve dependencies
        working-directory: packages/foxy
        run: flutter pub get

      - name: Analyze
        working-directory: packages/foxy
        run: flutter analyze

      - name: Test
        working-directory: packages/foxy
        run: flutter test

      # Workspace members: generator and lint plugin tests run as plain
      # Dart (no Flutter runtime), so they have their own steps.
      # `-j 1` serializes the test files: build_test suites initialize the
      # build_resolvers SDK cache (`.dart_tool/build_resolvers/sdk.sum`)
      # per test file, and parallel files hit a file-lock race on Windows
      # (PathAccessException: Access is denied). `-j 1` removes the
      # concurrency.
      - name: Test generator package
        working-directory: packages/foxy_generator
        run: dart test -j 1

      - name: Test lint package
        working-directory: packages/foxy_lint
        run: dart test -j 1

  # Suites that talk to a real MySQL. They live in a separate Linux job
  # because GitHub-hosted Windows runners support neither service containers
  # ("Container operations are only supported on Linux runners") nor a
  # preinstalled MySQL server — the windows-latest image only ships MySQL
  # client tools. The database layer is pure Dart (laconic_mysql →
  # buffer/crypto/laconic), so running it on Linux does not change what is
  # being tested.
  database-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: foxy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfoxy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/foxy
        run: flutter pub get

      # `--run-skipped` turns the tag back on: `integration` is skipped by
      # default (dart_test.yaml), so a plain `flutter test` needs no database.
      # FOXY_TEST_MYSQL_ALLOW_DROP / ALLOW_DBC_WRITE enable the destructive
      # tests (fresh-database rebuild, DBC import into foxy.dbc_*) — safe here
      # because the container is disposable. `-j 1` keeps suites serialized:
      # they share the single `foxy` schema name that MigrationRunner hardcodes.
      - name: Test (real MySQL)
        working-directory: packages/foxy
        env:
          FOXY_TEST_MYSQL_HOST: 127.0.0.1
          FOXY_TEST_MYSQL_PORT: "3306"
          FOXY_TEST_MYSQL_USER: root
          FOXY_TEST_MYSQL_PASSWORD: foxy
          FOXY_TEST_MYSQL_ALLOW_DROP: "1"
          FOXY_TEST_MYSQL_ALLOW_DBC_WRITE: "1"
        run: flutter test --tags integration --run-skipped -j 1