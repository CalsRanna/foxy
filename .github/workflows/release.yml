name: Release Windows

# Release flow (sole trigger: pushing a tag, e.g.
# `git tag v1.1.0 && git push origin v1.1.0`):
# 1. Before releasing, manually bump the `version` in pubspec.yaml and the
#    `## vX.Y.Z` section in CHANGELOG.md and commit;
# 2. After the tag push, this workflow automatically runs: analyze + test
#    gate → build the Release directory → compile the update helper → zip
#    it → generate latest.yaml (with SHA-256 and update notes; the releases
#    array keeps the most recent 3) → publish the GitHub Release.
#
# The app's update entry point is fixed at
# `releases/latest/download/latest.yaml`; the asset must keep that name.
#
# Prerelease tags (e.g. `v1.1.0-beta`): the zip and the manifest's zipUrl
# use the major version (`foxy-1.1.0.zip`), the GitHub Release is marked
# prerelease without displacing `releases/latest` (rule consistent with
# _stripPrereleaseSuffix in tool/release/make_update_manifest.dart).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # NOTE: codegen tests (test/infrastructure/codegen/) are currently
      # excluded from the release gate: they fail on pre-existing
      # FoxyBriefField projection bugs. Tracked separately; re-enable once
      # the generators are fixed.

  release-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          # Prerelease-suffix handling (consistent with
          # _stripPrereleaseSuffix in make_update_manifest.dart): the zip
          # file name and manifest zipUrl use the suffix-stripped major
          # version; the Release is marked prerelease while keeping the
          # suffixed title (e.g. "Foxy 1.1.0-beta").
          $mainTag = $tag
          $dashIndex = $tag.IndexOf('-')
          if ($dashIndex -ge 0 -and $tag.Substring($dashIndex + 1) -match '^[A-Za-z0-9.\-]+$') {
            $mainTag = $tag.Substring(0, $dashIndex)
          }
          $zipVersion = $mainTag.TrimStart('v')
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "zip-version=$zipVersion" >> $env:GITHUB_OUTPUT
          Write-Output "is-prerelease=$($mainTag -ne $tag)" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build updater helper
        run: >-
          dart compile exe tool/updater/updater_main.dart
          -o build/windows/x64/runner/Release/foxy_updater.exe

      - name: Package zip
        shell: pwsh
        run: >-
          Compress-Archive
          -Path build/windows/x64/runner/Release/*
          -DestinationPath foxy-${{ steps.version.outputs.zip-version }}.zip
          -CompressionLevel Optimal

      - name: Fetch previous manifest (for release history)
        shell: pwsh
        run: |
          if (curl -sfL -o existing.yaml `
              "https://github.com/CalsRanna/foxy/releases/latest/download/latest.yaml") {
            Write-Output "fetched previous manifest"
          } else {
            Write-Output "no previous manifest (first release)"
            # First CI release: latest.yaml does not exist yet. The manifest
            # script tolerates a missing existing.yaml (see
            # make_update_manifest.dart), so only create an empty placeholder
            # for the --existing flag.
            New-Item -ItemType File -Path existing.yaml | Out-Null
          }
          # curl failing leaves $LASTEXITCODE non-zero, which fails the step
          # even though the branch handled it; reset to 0 so a missing
          # previous manifest is a non-fatal first-release condition.
          $global:LASTEXITCODE = 0

      - name: Generate update manifest
        shell: pwsh
        run: >-
          dart run tool/release/make_update_manifest.dart
          --zip foxy-${{ steps.version.outputs.zip-version }}.zip
          --tag ${{ steps.version.outputs.tag }}
          --out latest.yaml
          --notes-out release_notes.md
          --existing existing.yaml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create ${{ steps.version.outputs.tag }}
          foxy-${{ steps.version.outputs.zip-version }}.zip latest.yaml
          --title "Foxy ${{ steps.version.outputs.version }}"
          --notes-file release_notes.md
          $(if (${{ steps.version.outputs.is-prerelease }} -eq 'true') { '--prerelease' })
