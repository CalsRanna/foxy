name: Release Windows

# 发布流程(唯一触发方式:推送 tag,如 `git tag v1.1.0 && git push origin v1.1.0`):
# 1. 发布前手动改 pubspec.yaml 的 version 与 CHANGELOG.md 的 `## vX.Y.Z` 段并提交;
# 2. 推送 tag 后本 workflow 自动:analyze + test 门禁 → 构建 Release 目录 →
#    编译更新辅助程序 → 打成 zip → 生成 latest.yaml(含 SHA-256 与更新说明,
#    releases 数组保留最近 3 版)→ 发布 GitHub Release。
#
# 应用更新入口固定为 `releases/latest/download/latest.yaml`,附件必须同名。
#
# 预发布 tag(如 `v1.1.0-beta`):zip 与清单 zipUrl 按主版本命名(`foxy-1.1.0.zip`),
# GitHub Release 标记 prerelease,不顶掉 `releases/latest`(规则与
# tool/release/make_update_manifest.dart 的 _stripPrereleaseSuffix 一致)。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 生成器测试依赖 dart:mirrors,flutter test VM 不提供,需用 dart test 跑。
      - name: Test (codegen)
        run: dart test test/infrastructure/codegen/

  release-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          # 预发布后缀处理(与 make_update_manifest.dart 的 _stripPrereleaseSuffix
          # 一致):zip 文件名与清单 zipUrl 用去掉后缀的主版本,Release 标记
          # prerelease 并保留后缀标题(如 "Foxy 1.1.0-beta")。
          $mainTag = $tag
          $dashIndex = $tag.IndexOf('-')
          if ($dashIndex -ge 0 -and $tag.Substring($dashIndex + 1) -match '^[A-Za-z0-9.\-]+$') {
            $mainTag = $tag.Substring(0, $dashIndex)
          }
          $zipVersion = $mainTag.TrimStart('v')
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "zip-version=$zipVersion" >> $env:GITHUB_OUTPUT
          Write-Output "is-prerelease=$($mainTag -ne $tag)" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build updater helper
        run: >-
          dart compile exe tool/updater/updater_main.dart
          -o build/windows/x64/runner/Release/foxy_updater.exe

      - name: Package zip
        shell: pwsh
        run: >-
          Compress-Archive
          -Path build/windows/x64/runner/Release/*
          -DestinationPath foxy-${{ steps.version.outputs.zip-version }}.zip
          -CompressionLevel Optimal

      - name: Fetch previous manifest (for release history)
        shell: pwsh
        run: |
          if (curl -sfL -o existing.yaml `
              "https://github.com/CalsRanna/foxy/releases/latest/download/latest.yaml") {
            Write-Output "fetched previous manifest"
          } else {
            Write-Output "no previous manifest (first release)"
          }

      - name: Generate update manifest
        shell: pwsh
        run: >-
          dart run tool/release/make_update_manifest.dart
          --zip foxy-${{ steps.version.outputs.zip-version }}.zip
          --tag ${{ steps.version.outputs.tag }}
          --out latest.yaml
          --notes-out release_notes.md
          --existing existing.yaml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create ${{ steps.version.outputs.tag }}
          foxy-${{ steps.version.outputs.zip-version }}.zip latest.yaml
          --title "Foxy ${{ steps.version.outputs.version }}"
          --notes-file release_notes.md
          $(if (${{ steps.version.outputs.is-prerelease }} -eq 'true') { '--prerelease' })
