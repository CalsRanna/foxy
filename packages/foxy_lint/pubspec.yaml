name: foxy_lint
description: "Foxy 的 analyzer 插件 — 项目专属 lint 规则(官方 analyzer 插件系统, Dart 3.10+)。"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # Version 0.3.18 pins analyzer 13.3.0. Version 0.3.25 needs analyzer 14.6,
  # which exceeds the upper bound imposed by auto_route_generator.
  analysis_server_plugin: ^0.3.18
  analyzer: ^13.3.0
  path: ^1.9.1

dev_dependencies:
  analyzer_testing: ^0.3.2
  test: ^1.30.0
  test_reflective_loader: ^0.6.0
  yaml: ^3.1.3
