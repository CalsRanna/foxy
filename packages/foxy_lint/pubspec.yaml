name: foxy_lint
description: "Foxy 的 analyzer 插件 — 项目专属 lint 规则(官方 analyzer 插件系统, Dart 3.10+)。"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  # 0.3.10 / 10.2.0: 与 workspace 的 analyzer 10.2.0 匹配(Flutter 3.44.9
  # 依赖 pin 限制,见 foxy_generator 注释)。
  analysis_server_plugin: ^0.3.10
  analyzer: ^10.2.0
  path: ^1.9.1

dev_dependencies:
  analyzer_testing: ^0.2.1
  test: ^1.30.0
  test_reflective_loader: ^0.4.0
