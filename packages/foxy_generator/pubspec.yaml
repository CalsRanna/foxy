name: foxy_generator
description: "Foxy 代码生成器 — 读取 foxy_annotation 注解,生成 Entity / Repository / ViewModel 样板代码。"
publish_to: none

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  # 10.2.0: Flutter 3.44.9 的依赖 pin(meta 1.18.0 / test_api 0.7.11)限定了
  # 链路上限;auto_route_generator 10.5.0 要求 analyzer <11,test 1.31.0 要求
  # <13,meta 要求 13.1 以下,三者交集的上限是 10.2.0。
  analyzer: ^10.2.0
  build: ^4.0.7
  foxy_annotation:
    path: ../foxy_annotation
  source_gen: ^4.2.4

dev_dependencies:
  build_test: ^3.3.2
  test: ^1.30.0
