name: foxy_generator
description: "Foxy 代码生成器 — 读取 foxy_annotation 注解,生成 Entity / Repository / ViewModel 样板代码。"
publish_to: none

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  # <8.4.0: source_gen 3.1.0 依赖 analyzer 私有 API(DartObjectImpl.getInvocation),
  # 在 8.4.0 中被移除,升上去生成器测试无法编译。
  analyzer: ">=8.1.1 <8.4.0"
  build: ^3.1.0
  foxy_annotation:
    path: ../foxy_annotation
  source_gen: ^3.1.0

dev_dependencies:
  build_test: ^3.3.2
  test: ^1.30.0
