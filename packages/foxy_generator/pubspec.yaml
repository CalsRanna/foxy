name: foxy_generator
description: "Foxy 代码生成器 — 读取 foxy_annotation 注解,生成 Entity / Repository / ViewModel 样板代码。"
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  # 13.3.0: auto_route_generator 10.6.0 与 test 1.31.1 都要求 analyzer <14,
  # 13.3.0 是满足该上限的最新 analyzer 版本。
  analyzer: ^13.3.0
  build: ^4.0.7
  foxy_annotation:
    path: ../foxy_annotation
  source_gen: ^4.2.4

dev_dependencies:
  build_test: ^3.3.2
  test: ^1.30.0
