# Analyzer plugins can only be declared in the workspace-root
# analysis_options.yaml; include it to get both flutter_lints and the
# foxy_lint rules here.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: ../../analysis_options.yaml

linter:
  rules:
    # 统一使用包绝对路径导入(package:...),禁止相对路径导入
    always_use_package_imports: true
