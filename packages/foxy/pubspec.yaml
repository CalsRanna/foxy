name: foxy
description: "AzerothCore 数据库可视化管理工具 — 管理生物、物品、任务、法术等游戏数据。"
publish_to: "none"
version: 1.1.2+690

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  archive: ^4.0.9
  # 11.x: auto_route_generator 10.6.0(支持 analyzer 12)要求 auto_route ^11.1.0。
  auto_route: ^11.1.0
  collection: ^1.19.1
  crypto: ^3.0.7
  file_selector: ^1.1.0
  foxy_annotation:
    path: ../foxy_annotation
  get_it: ^9.0.5
  http: ^1.6.0
  laconic: ^3.0.0
  laconic_mysql: ^3.1.0
  logger: ^2.4.0
  lucide_icons_flutter: ^3.1.14
  meta: ^1.17.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  shadcn_ui: ^0.55.0
  shared_preferences: ^2.3.5
  signals: ^6.0.2
  signals_flutter: ^6.0.2
  url_launcher: ^6.3.1
  window_manager: ^0.5.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.2
  warcrafty: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  auto_route_generator: ^10.5.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  foxy_generator:
    path: ../foxy_generator
  foxy_lint:
    path: ../foxy_lint
  icons_launcher: ^3.1.0
  test: ^1.30.0

flutter:
  uses-material-design: true

  assets:
    - asset/image/
